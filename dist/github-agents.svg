<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 420" width="1180" height="420">
<defs>
  <radialGradient id="bg" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="#0F1E3A"/><stop offset="100%" stop-color="#0A0E1A"/>
  </radialGradient>
  <linearGradient id="borderG" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00D4FF"/><stop offset="50%" stop-color="#00FF9F"/>
    <stop offset="100%" stop-color="#FF6B00"/>
  </linearGradient>
  <filter id="gc"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="gg"><feGaussianBlur stdDeviation="9"  result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="ga"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="gv"><feGaussianBlur stdDeviation="9"  result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="gr"><feGaussianBlur stdDeviation="7"  result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="pk"><feGaussianBlur stdDeviation="4"  result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

  <style>
    .lbl{font-family:"JetBrains Mono","Fira Code",monospace;font-size:11px;letter-spacing:1px;font-weight:700}
    .sub{font-family:"JetBrains Mono","Fira Code",monospace;font-size:11px;letter-spacing:0.5px;fill:#94A3B8}
    .ptitle{font-family:"Courier New",monospace;font-size:11px;fill:#00D4FF;letter-spacing:2px;opacity:0.6}
    .pktlbl{font-family:"Courier New",monospace;font-size:9px;fill:#00D4FF;letter-spacing:0.5px}
    .stat{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:700}
    .statlbl{font-family:"Courier New",monospace;font-size:11px;fill:#94A3B8;letter-spacing:1px}
    .b1,.b1e,.b2,.b2h,.b2e,.b3,.b3e,.b4,.b4e,.b5,.b5e,.sl,.sr{transform-box:fill-box;transform-origin:50% 50%}

    /* HARVESTER — blob — cyan — idle→working loop */
    @keyframes hv{0%,100%{transform:translateY(0)} 3%{transform:translateY(-8px)} 6%{transform:translateY(0)} 20%{transform:rotate(2.5deg) scaleX(1.13) scaleY(0.87)} 21.5%{transform:rotate(-2.5deg) scaleX(0.87) scaleY(1.13)} 23%{transform:rotate(2.5deg) scaleX(1.1) scaleY(0.9)} 25%{transform:rotate(0)} 50%{transform:translateY(-7px)} 55%{transform:translateY(0)}}
    @keyframes hve{0%,100%{transform:scaleX(1) scaleY(1)} 3%{transform:scaleX(1) scaleY(0.07)} 5%{transform:scaleX(1) scaleY(1)} 20%,25%{transform:scaleX(1.24) scaleY(0.62)} 26%,100%{transform:scaleX(1) scaleY(1)}}

    /* ARCHIFY — hexagon — amber — working constantly */
    @keyframes av{0%{transform:rotate(2.5deg) scaleX(1.1) scaleY(0.9)} 1.5%{transform:rotate(-2.5deg) scaleX(0.9) scaleY(1.1)} 3%{transform:rotate(2.5deg) scaleX(1.08) scaleY(0.92)} 4.5%{transform:rotate(-2.5deg) scaleX(0.92) scaleY(1.08)} 6%{transform:rotate(1.5deg) scaleX(1.06) scaleY(0.94)} 8%,100%{transform:rotate(0) scaleX(1) scaleY(1)}}
    @keyframes ave{0%,100%{transform:scaleX(1.24) scaleY(0.62)}}

    /* COACH — teardrop — green — state based on trend */
    @keyframes cb{0%{transform:scaleX(1.22) scaleY(0.78)} 15%{transform:scaleX(0.94) scaleY(1.06)} 30%{transform:scaleX(1.04) scaleY(0.96)} 50%,100%{transform:scaleX(1) scaleY(1) translateY(-3px)}}
    @keyframes ce{0%,100%{transform:scaleX(1.06) scaleY(0.72) rotate(-15deg)}}

    /* WIKI — squircle — violet — done loop */
    @keyframes wv{0%,100%{transform:scaleX(1) scaleY(1) translateY(-3px)} 5%{transform:scaleX(1.2) scaleY(0.8)} 8%{transform:scaleX(0.95) scaleY(1.05)} 12%{transform:scaleX(1) scaleY(1)} 50%{transform:translateY(-6px)} 55%{transform:translateY(-3px)}}
    @keyframes wve{0%,100%{transform:scaleX(1.06) scaleY(0.72) rotate(-15deg)} 50%{transform:scaleX(1) scaleY(0.07) rotate(0)} 52%{transform:scaleX(1.06) scaleY(0.72) rotate(-15deg)}}

    /* ENFORCER — triangle — red — shudder */
    @keyframes ev{0%,100%{transform:translateX(0)} 20%{transform:translateX(2.5px)} 40%{transform:translateX(-2.5px)} 60%{transform:translateX(2px)} 80%{transform:translateX(-2px)}}
    @keyframes eve{0%,100%{transform:scaleX(0.86) scaleY(0.5) rotate(16deg)} 40%{transform:scaleX(0.86) scaleY(0.07) rotate(16deg)} 44%{transform:scaleX(0.86) scaleY(0.5) rotate(16deg)}}
    @keyframes alert{0%,100%{r:40;opacity:0.18}50%{r:50;opacity:0.04}}

    /* satellite for coach when thinking */
    @keyframes rsl{0%,100%{transform:translate(-34px,0);opacity:0.75} 50%{transform:translate(-26px,-16px);opacity:0.75}}
    @keyframes rsr{0%,100%{transform:translate(34px,0);opacity:0.55} 50%{transform:translate(26px,16px);opacity:0.55}}

    .b1{animation:hv 6s ease-in-out infinite}
    .b1e{animation:hve 6s ease-in-out infinite}
    .b2{animation:av 0.45s ease-in-out infinite}
    .b2e{animation:ave 0.45s ease-in-out infinite}
    .b3{animation:cb 3s ease-in-out infinite}
    .b3e{animation:ce 1.2s ease-in-out infinite}
    .b4{animation:wv 4s ease-in-out infinite}
    .b4e{animation:wve 4s ease-in-out infinite}
    .b5{animation:ev 0.45s ease-in-out infinite;animation-delay:1.5s}
    .b5e{animation:eve 1.2s ease-in-out infinite}
    .ar{animation:alert 1.5s ease-in-out infinite}
    .sl{animation:rsl 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
    .sr{animation:rsr 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
  </style>
</defs>

<!-- background -->
<rect width="1180" height="420" rx="16" fill="url(#bg)"/>
<rect width="1180" height="420" rx="16" fill="none" stroke="url(#borderG)" stroke-width="1.5" opacity="0.4"/>

