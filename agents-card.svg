<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 280" width="1180" height="280">
<defs>
  <radialGradient id="bg" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="#0F1E3A"/>
    <stop offset="100%" stop-color="#0A0E1A"/>
  </radialGradient>
  <linearGradient id="borderG" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00D4FF"/>
    <stop offset="50%" stop-color="#00FF9F"/>
    <stop offset="100%" stop-color="#FF6B00"/>
  </linearGradient>

  <!-- glow filters per bot -->
  <filter id="glow-cyan" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-green" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-amber" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-violet" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-red" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <style>
    .label { font-family: 'JetBrains Mono','Fira Code',monospace; font-size: 13px; letter-spacing: 1.5px; }
    .sub   { font-family: 'JetBrains Mono','Fira Code',monospace; font-size: 10px; letter-spacing: 0.5px; fill: #475569; }
    .panel-title { font-family: 'Courier New',monospace; font-size: 11px; fill: #00D4FF; letter-spacing: 2px; opacity: 0.6; }

    /* BOT 1 — ORCHESTRATOR — idle — cyan blob */
    @keyframes bob1 { 0%,100%{transform:translateY(0) scaleX(1.02) scaleY(0.98)} 50%{transform:translateY(-6px) scaleX(0.98) scaleY(1.02)} }
    @keyframes morph1 {
      0%  { rx:38; ry:44 } 25% { rx:44; ry:38 } 50% { rx:36; ry:46 } 75% { rx:46; ry:36 } 100%{ rx:38; ry:44 }
    }
    @keyframes blink1 { 0%,92%,100%{transform:scaleY(1)} 94%,98%{transform:scaleY(0.06)} }
    .bot1-body { animation: bob1 2.8s ease-in-out infinite; transform-origin:118px 118px; }
    .bot1-blink { animation: blink1 4s ease-in-out infinite; transform-origin:118px 118px; }

    /* BOT 2 — RESEARCHER — thinking — green blob, head shrinks */
    @keyframes bob2 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
    @keyframes think2 { 0%,100%{transform:scale(0.88)} 50%{transform:scale(0.92)} }
    @keyframes orbit-l { 0%{transform:translate(-32px,0) scale(1)} 50%{transform:translate(-26px,-14px) scale(0.8)} 100%{transform:translate(-32px,0) scale(1)} }
    @keyframes orbit-r { 0%{transform:translate(32px,0) scale(0.8)} 50%{transform:translate(26px,14px) scale(1)} 100%{transform:translate(32px,0) scale(0.8)} }
    @keyframes blink2 { 0%,88%,100%{transform:scaleX(0.9) scaleY(0.82)} 91%,96%{transform:scaleX(0.9) scaleY(0.06)} }
    @keyframes scan2 { 0%,100%{transform:translateX(-5px)} 50%{transform:translateX(5px)} }
    .bot2-body { animation: bob2 1.1s ease-in-out infinite; transform-origin:354px 118px; }
    .bot2-head { animation: think2 1.1s ease-in-out infinite; transform-origin:354px 118px; }
    .bot2-sat-l { animation: orbit-l 2.6s ease-in-out infinite; transform-origin:354px 118px; }
    .bot2-sat-r { animation: orbit-r 2.6s ease-in-out infinite; transform-origin:354px 118px; }
    .bot2-eyes  { animation: scan2 1.0s ease-in-out infinite; }
    .bot2-blink { animation: blink2 2s ease-in-out infinite; transform-origin:354px 118px; }

    /* BOT 3 — BUILDER — working — amber, hard squash, tilt */
    @keyframes bob3 { 0%,100%{transform:translateY(0) rotate(2.5deg) scaleX(1.13) scaleY(0.87)} 50%{transform:translateY(-4px) rotate(-2.5deg) scaleX(0.87) scaleY(1.13)} }
    @keyframes blink3 { 0%,85%,100%{transform:scaleY(1)} 88%,93%{transform:scaleY(0.08)} }
    .bot3-body { animation: bob3 0.42s ease-in-out infinite; transform-origin:590px 118px; }
    .bot3-blink { animation: blink3 1.8s ease-in-out infinite; transform-origin:590px 118px; }

    /* BOT 4 — MEMORY — done — violet, elastic settle */
    @keyframes bob4 { 0%,100%{transform:translateY(0) scaleX(1.01) scaleY(0.99)} 50%{transform:translateY(-5px) scaleX(0.99) scaleY(1.01)} }
    @keyframes done4 { 0%{transform:scaleX(1.22) scaleY(0.78)} 60%{transform:scaleX(0.96) scaleY(1.04)} 100%{transform:scaleX(1) scaleY(1)} }
    @keyframes blink4 { 0%,90%,100%{transform:scaleY(0.72) rotate(-15deg)} 93%,97%{transform:scaleY(0.06) rotate(-15deg)} }
    .bot4-body { animation: bob4 2.2s ease-in-out infinite; transform-origin:826px 118px; }
    .bot4-blink { animation: blink4 3.4s ease-in-out infinite; transform-origin:826px 118px; }

    /* BOT 5 — GUARDIAN — blocked — red, tight shudder */
    @keyframes shudder5 { 0%,100%{transform:translateX(0)} 20%{transform:translateX(2.5px)} 40%{transform:translateX(-2.5px)} 60%{transform:translateX(2px)} 80%{transform:translateX(-2px)} }
    @keyframes blink5 { 0%,80%,100%{transform:scaleX(0.86) scaleY(0.5) rotate(16deg)} 84%,90%{transform:scaleX(0.86) scaleY(0.06) rotate(16deg)} }
    .bot5-body { animation: shudder5 0.4s ease-in-out infinite; animation-delay: 1.5s; transform-origin:1062px 118px; }
    .bot5-blink { animation: blink5 1.2s ease-in-out infinite; transform-origin:1062px 118px; }
  </style>
</defs>

<!-- background -->
<rect width="1180" height="280" rx="16" fill="url(#bg)"/>
<rect width="1180" height="280" rx="16" fill="none" stroke="url(#borderG)" stroke-width="1.5" opacity="0.4"/>

<!-- panel title -->
<text x="50%" y="30" text-anchor="middle" class="panel-title">AGENT.ROSTER</text>
<line x1="40" y1="38" x2="1140" y2="38" stroke="#00D4FF" stroke-width="0.5" opacity="0.15"/>

<!-- ═══════════════════════════════════════════ -->
<!-- BOT 1 — ORCHESTRATOR — idle — cyan         -->
<!-- ═══════════════════════════════════════════ -->
<g class="bot1-body">
  <!-- blob body -->
  <ellipse cx="118" cy="118" rx="56" ry="58" fill="#00D4FF" filter="url(#glow-cyan)"
    style="border-radius:62% 38% 46% 54%/54% 46% 54% 46%">
    <animate attributeName="rx" values="56;52;58;50;56" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="58;62;54;60;58" dur="2.8s" repeatCount="indefinite"/>
  </ellipse>
  <!-- highlight -->
  <ellipse cx="100" cy="98" rx="18" ry="12" fill="rgba(255,255,255,0.20)" transform="rotate(-24 100 98)"/>
</g>
<!-- eyes -->
<g class="bot1-blink">
  <rect x="101" y="108" width="11" height="22" rx="5" fill="#0A0E1A"/>
  <rect x="124" y="108" width="11" height="22" rx="5" fill="#0A0E1A"/>
</g>
<!-- presence dot -->
<circle cx="160" cy="158" r="7" fill="#00FF9F" stroke="#0A0E1A" stroke-width="2"/>
<!-- label -->
<text x="118" y="205" text-anchor="middle" class="label" fill="#00D4FF">orchestrator</text>
<text x="118" y="221" text-anchor="middle" class="sub">idle · directing</text>

<!-- ═══════════════════════════════════════════ -->
<!-- BOT 2 — RESEARCHER — thinking — green      -->
<!-- ═══════════════════════════════════════════ -->
<!-- satellites -->
<g class="bot2-sat-l">
  <ellipse cx="354" cy="118" rx="11" ry="11" fill="#00FF9F" opacity="0.72"/>
</g>
<g class="bot2-sat-r">
  <ellipse cx="354" cy="118" rx="9" ry="9" fill="#00FF9F" opacity="0.5"/>
</g>
<!-- blob body (shrunk for thinking) -->
<g class="bot2-body">
  <g class="bot2-head">
    <ellipse cx="354" cy="118" rx="46" ry="48" fill="#00FF9F" filter="url(#glow-green)">
      <animate attributeName="rx" values="46;42;48;44;46" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="48;52;46;50;48" dur="1.1s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="336" cy="100" rx="14" ry="10" fill="rgba(255,255,255,0.18)" transform="rotate(-24 336 100)"/>
  </g>
</g>
<!-- eyes scanning -->
<g class="bot2-blink">
  <g class="bot2-eyes">
    <rect x="338" y="111" width="10" height="18" rx="5" fill="#0A0E1A"/>
    <rect x="358" y="113" width="10" height="18" rx="5" fill="#0A0E1A"/>
  </g>
</g>
<text x="354" y="205" text-anchor="middle" class="label" fill="#00FF9F">researcher</text>
<text x="354" y="221" text-anchor="middle" class="sub">thinking · scanning</text>

<!-- ═══════════════════════════════════════════ -->
<!-- BOT 3 — BUILDER — working — amber          -->
<!-- ═══════════════════════════════════════════ -->
<g class="bot3-body">
  <ellipse cx="590" cy="118" rx="58" ry="56" fill="#FF6B00" filter="url(#glow-amber)">
    <animate attributeName="rx" values="58;54;60;52;58" dur="0.42s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="56;60;52;58;56" dur="0.42s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="571" cy="98" rx="20" ry="13" fill="rgba(255,255,255,0.22)" transform="rotate(-24 571 98)"/>
</g>
<!-- eyes: wide x, squashed y — the "hard at work" look -->
<g class="bot3-blink">
  <rect x="572" y="112" width="14" height="14" rx="5" fill="#0A0E1A"/>
  <rect x="597" y="109" width="14" height="19" rx="5" fill="#0A0E1A"/>
</g>
<text x="590" y="205" text-anchor="middle" class="label" fill="#FF6B00">builder</text>
<text x="590" y="221" text-anchor="middle" class="sub">working · shipping</text>

<!-- ═══════════════════════════════════════════ -->
<!-- BOT 4 — MEMORY — done — violet             -->
<!-- ═══════════════════════════════════════════ -->
<g class="bot4-body">
  <ellipse cx="826" cy="118" rx="54" ry="56" fill="#7C3AED" filter="url(#glow-violet)">
    <animate attributeName="rx" values="54;50;56;52;54" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="56;60;54;58;56" dur="2.2s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="808" cy="98" rx="17" ry="11" fill="rgba(255,255,255,0.20)" transform="rotate(-24 808 98)"/>
</g>
<!-- eyes: arced up (done — "smile made of eyes") -->
<g class="bot4-blink">
  <rect x="810" y="106" width="11" height="20" rx="5" fill="#0A0E1A" transform="rotate(-15 816 116)"/>
  <rect x="833" y="106" width="11" height="20" rx="5" fill="#0A0E1A" transform="rotate(-15 839 116)"/>
</g>
<text x="826" y="205" text-anchor="middle" class="label" fill="#7C3AED">memory</text>
<text x="826" y="221" text-anchor="middle" class="sub">done · persisted</text>

<!-- ═══════════════════════════════════════════ -->
<!-- BOT 5 — GUARDIAN — blocked — red           -->
<!-- ═══════════════════════════════════════════ -->
<g class="bot5-body">
  <!-- squircle variant for guardian — distinct shape -->
  <rect x="1022" y="68" width="80" height="80" rx="22" fill="#FF4444" filter="url(#glow-red)"/>
  <ellipse cx="1045" cy="84" rx="14" ry="9" fill="rgba(255,255,255,0.18)" transform="rotate(-24 1045 84)"/>
</g>
<!-- eyes: tense inward tilt (blocked) -->
<g class="bot5-blink">
  <rect x="1043" y="102" width="11" height="16" rx="4" fill="#0A0E1A" transform="rotate(16 1049 110)"/>
  <rect x="1064" y="102" width="11" height="16" rx="4" fill="#0A0E1A" transform="rotate(16 1070 110)"/>
</g>
<!-- alert ring -->
<circle cx="1062" cy="108" r="46" fill="none" stroke="#FF4444" stroke-width="1.5" opacity="0.25">
  <animate attributeName="r" values="46;52;46" dur="1.5s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.25;0.05;0.25" dur="1.5s" repeatCount="indefinite"/>
</circle>
<text x="1062" y="205" text-anchor="middle" class="label" fill="#FF4444">guardian</text>
<text x="1062" y="221" text-anchor="middle" class="sub">blocked · alerting</text>

<!-- divider lines between bots -->
<line x1="236" y1="50" x2="236" y2="230" stroke="#1E3A5F" stroke-width="1" opacity="0.6"/>
<line x1="472" y1="50" x2="472" y2="230" stroke="#1E3A5F" stroke-width="1" opacity="0.6"/>
<line x1="708" y1="50" x2="708" y2="230" stroke="#1E3A5F" stroke-width="1" opacity="0.6"/>
<line x1="944" y1="50" x2="944" y2="230" stroke="#1E3A5F" stroke-width="1" opacity="0.6"/>

<!-- bottom manifesto -->
<text x="590" y="258" text-anchor="middle" font-family="Courier New,monospace" font-size="11px" fill="#1E3A5F" letter-spacing="2px">abheos runtime · 5 agents · DEPLOYED</text>
</svg>
