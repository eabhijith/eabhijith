<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 340" width="1180" height="340">
<defs>
  <radialGradient id="bg" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="#0F1E3A"/>
    <stop offset="100%" stop-color="#0A0E1A"/>
  </radialGradient>
  <linearGradient id="borderG" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00D4FF"/>
    <stop offset="50%" stop-color="#00FF9F"/>
    <stop offset="100%" stop-color="#FF6B00"/>
  </linearGradient>

  <!-- flow line gradient: cyan → green -->
  <linearGradient id="flowCG" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00D4FF"/>
    <stop offset="100%" stop-color="#00FF9F"/>
  </linearGradient>
  <!-- flow line gradient: green → amber -->
  <linearGradient id="flowGA" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00FF9F"/>
    <stop offset="100%" stop-color="#FF6B00"/>
  </linearGradient>
  <!-- flow line gradient: amber → violet -->
  <linearGradient id="flowAV" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#FF6B00"/>
    <stop offset="100%" stop-color="#7C3AED"/>
  </linearGradient>
  <!-- guardian vertical lines -->
  <linearGradient id="flowVR" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#FF4444"/>
    <stop offset="100%" stop-color="#7C3AED"/>
  </linearGradient>

  <!-- glow filters -->
  <filter id="gc" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="gg" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="ga" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="gv" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="gr" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="lineglow">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <style>
    .lbl { font-family:'JetBrains Mono','Fira Code',monospace; font-size:12px; letter-spacing:1px; font-weight:700; }
    .sub { font-family:'JetBrains Mono','Fira Code',monospace; font-size:9.5px; letter-spacing:0.5px; fill:#475569; }
    .ptitle { font-family:'Courier New',monospace; font-size:11px; fill:#00D4FF; letter-spacing:2px; opacity:0.6; }

    /* ── BOT BOBS ── */
    @keyframes bob  { 0%,100%{transform:translateY(0)}   50%{transform:translateY(-7px)} }
    @keyframes bobs { 0%,100%{transform:translateY(0) rotate(2.5deg)} 50%{transform:translateY(-4px) rotate(-2.5deg)} }
    @keyframes bobw { 0%,100%{transform:translateY(0) rotate(-4deg)} 50%{transform:translateY(-3px) rotate(-4deg)} }
    @keyframes shud { 0%,100%{transform:translateX(0)} 25%{transform:translateX(2.5px)} 75%{transform:translateX(-2.5px)} }
    @keyframes blink{ 0%,90%,100%{transform:scaleY(1)} 93%,97%{transform:scaleY(0.07)} }
    @keyframes scan { 0%,100%{transform:translateX(-5px)} 50%{transform:translateX(5px)} }
    @keyframes orbl { 0%{transform:translate(-34px,0)}  50%{transform:translate(-27px,-16px)} 100%{transform:translate(-34px,0)} }
    @keyframes orbr { 0%{transform:translate(34px,0)}   50%{transform:translate(27px,16px)}  100%{transform:translate(34px,0)} }
    @keyframes pulse{ 0%,100%{opacity:0.18} 50%{opacity:0.55} }
    @keyframes morph1{ 0%,100%{rx:52;ry:56} 33%{rx:58;ry:50} 66%{rx:48;ry:58} }
    @keyframes morph2{ 0%,100%{rx:40;ry:44} 33%{rx:46;ry:38} 66%{rx:36;ry:46} }
    @keyframes morph3{ 0%,100%{rx:54;ry:52} 33%{rx:60;ry:46} 66%{rx:50;ry:58} }
    @keyframes morph4{ 0%,100%{rx:50;ry:54} 33%{rx:56;ry:48} 66%{rx:46;ry:56} }

    /* bots */
    .b1 { animation: bob  2.8s ease-in-out infinite; }
    .b2 { animation: bob  1.1s ease-in-out infinite; }
    .b3 { animation: bobs 0.42s ease-in-out infinite; }
    .b4 { animation: bob  2.2s ease-in-out infinite; }
    .b5 { animation: shud 0.4s  ease-in-out infinite; animation-delay:1.5s; }

    .bk { animation: blink 3.6s ease-in-out infinite; }
    .bk2{ animation: blink 2.0s ease-in-out infinite; }
    .bk3{ animation: blink 1.8s ease-in-out infinite; }
    .bk4{ animation: blink 3.2s ease-in-out infinite; }
    .bk5{ animation: blink 1.2s ease-in-out infinite; }
    .sc { animation: scan  1.0s ease-in-out infinite; }
    .ol { animation: orbl  2.6s ease-in-out infinite; }
    .or { animation: orbr  2.6s ease-in-out infinite; }

    /* ── DATA PULSE along flow lines ── */
    /* Each circle travels the path by animating cx from start to end */
    @keyframes px12a{ 0%{cx:220;opacity:0} 5%{opacity:1} 90%{opacity:1} 100%{cx:390;opacity:0} }
    @keyframes px12b{ 0%{cx:220;opacity:0} 5%{opacity:1} 90%{opacity:1} 100%{cx:390;opacity:0} }
    @keyframes px23a{ 0%{cx:490;opacity:0} 5%{opacity:1} 90%{opacity:1} 100%{cx:660;opacity:0} }
    @keyframes px23b{ 0%{cx:490;opacity:0} 5%{opacity:1} 90%{opacity:1} 100%{cx:660;opacity:0} }
    @keyframes px34a{ 0%{cx:760;opacity:0} 5%{opacity:1} 90%{opacity:1} 100%{cx:930;opacity:0} }
    @keyframes px34b{ 0%{cx:760;opacity:0} 5%{opacity:1} 90%{opacity:1} 100%{cx:930;opacity:0} }

    /* guardian arcs down to builder + memory */
    @keyframes pgb{ 0%{opacity:0;r:3} 20%{opacity:1;r:4} 80%{opacity:1;r:4} 100%{opacity:0;r:3} }

    .p12a{ animation: px12a 1.8s ease-in-out infinite; }
    .p12b{ animation: px12b 1.8s ease-in-out infinite; animation-delay:0.9s; }
    .p23a{ animation: px23a 1.8s ease-in-out infinite; animation-delay:0.3s; }
    .p23b{ animation: px23b 1.8s ease-in-out infinite; animation-delay:1.2s; }
    .p34a{ animation: px34a 1.8s ease-in-out infinite; animation-delay:0.6s; }
    .p34b{ animation: px34b 1.8s ease-in-out infinite; animation-delay:1.5s; }
    .pgb { animation: pgb   2.4s ease-in-out infinite; }

    /* label badge pulse */
    @keyframes badgep{ 0%,100%{opacity:0.7} 50%{opacity:1} }
    .badge{ animation: badgep 2s ease-in-out infinite; }
  </style>
</defs>

<!-- ── background ── -->
<rect width="1180" height="340" rx="16" fill="url(#bg)"/>
<rect width="1180" height="340" rx="16" fill="none" stroke="url(#borderG)" stroke-width="1.5" opacity="0.45"/>

<!-- panel title -->
<text x="590" y="30" text-anchor="middle" class="ptitle">AGENT.ROSTER  ·  abheos runtime</text>
<line x1="40" y1="40" x2="1140" y2="40" stroke="#00D4FF" stroke-width="0.5" opacity="0.15"/>

<!-- ═══════════════════════════════════════════════════════════ -->
<!--  FLOW LINES + DATA PULSES (drawn UNDER the bots)          -->
<!-- ═══════════════════════════════════════════════════════════ -->

<!-- line 1→2: orchestrator → researcher -->
<line x1="218" y1="155" x2="392" y2="155" stroke="url(#flowCG)" stroke-width="1.5" opacity="0.35" filter="url(#lineglow)"/>
<line x1="218" y1="155" x2="392" y2="155" stroke="url(#flowCG)" stroke-width="0.8" opacity="0.7"/>
<!-- arrow -->
<polygon points="390,150 400,155 390,160" fill="#00FF9F" opacity="0.8"/>
<!-- pulses -->
<circle class="p12a" cy="155" r="4" fill="#00D4FF" filter="url(#lineglow)"/>
<circle class="p12b" cy="155" r="3" fill="#00FF9F" opacity="0.8"/>
<!-- label -->
<text x="305" y="146" text-anchor="middle" class="sub" fill="#00D4FF" font-size="8px" letter-spacing="1px">task</text>

<!-- line 2→3: researcher → builder -->
<line x1="488" y1="155" x2="662" y2="155" stroke="url(#flowGA)" stroke-width="1.5" opacity="0.35" filter="url(#lineglow)"/>
<line x1="488" y1="155" x2="662" y2="155" stroke="url(#flowGA)" stroke-width="0.8" opacity="0.7"/>
<polygon points="660,150 670,155 660,160" fill="#FF6B00" opacity="0.8"/>
<circle class="p23a" cy="155" r="4" fill="#00FF9F" filter="url(#lineglow)"/>
<circle class="p23b" cy="155" r="3" fill="#FF6B00" opacity="0.8"/>
<text x="575" y="146" text-anchor="middle" class="sub" fill="#00FF9F" font-size="8px" letter-spacing="1px">context</text>

<!-- line 3→4: builder → memory -->
<line x1="758" y1="155" x2="932" y2="155" stroke="url(#flowAV)" stroke-width="1.5" opacity="0.35" filter="url(#lineglow)"/>
<line x1="758" y1="155" x2="932" y2="155" stroke="url(#flowAV)" stroke-width="0.8" opacity="0.7"/>
<polygon points="930,150 940,155 930,160" fill="#7C3AED" opacity="0.8"/>
<circle class="p34a" cy="155" r="4" fill="#FF6B00" filter="url(#lineglow)"/>
<circle class="p34b" cy="155" r="3" fill="#7C3AED" opacity="0.8"/>
<text x="845" y="146" text-anchor="middle" class="sub" fill="#FF6B00" font-size="8px" letter-spacing="1px">result</text>

<!-- guardian arcs: curved lines DOWN from top to builder + memory -->
<!-- guardian sits at top center (x=1062) — arc down-left to builder (590) and memory (826) -->
<path d="M 1040,80 Q 870,40 710,100" fill="none" stroke="#FF4444" stroke-width="1" stroke-dasharray="4 4" opacity="0.35" filter="url(#lineglow)"/>
<path d="M 1055,80 Q 970,40 870,100" fill="none" stroke="#FF4444" stroke-width="1" stroke-dasharray="4 4" opacity="0.35" filter="url(#lineglow)"/>
<!-- pulse along guardian arcs -->
<circle class="pgb" cy="60" cx="870" r="4" fill="#FF4444" filter="url(#gr)"/>
<text x="1050" y="58" text-anchor="middle" class="sub" fill="#FF4444" font-size="8px" letter-spacing="1px">watching</text>

<!-- ═══════════════════════════════════════════════════════════ -->
<!--  BOT 1 — ORCHESTRATOR — x=118 — cyan — idle               -->
<!-- ═══════════════════════════════════════════════════════════ -->
<g class="b1" style="transform-origin:118px 155px">
  <ellipse cx="118" cy="155" rx="52" ry="56" fill="#00D4FF" filter="url(#gc)" opacity="0.95">
    <animate attributeName="rx" values="52;56;50;54;52" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="56;52;58;54;56" dur="2.8s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="102" cy="136" rx="16" ry="10" fill="rgba(255,255,255,0.22)" transform="rotate(-24 102 136)"/>
</g>
<g class="bk" style="transform-origin:118px 155px">
  <rect x="103" y="146" width="10" height="20" rx="5" fill="#0A0E1A"/>
  <rect x="125" y="146" width="10" height="20" rx="5" fill="#0A0E1A"/>
</g>
<!-- presence dot -->
<circle cx="162" cy="195" r="6" fill="#00FF9F" stroke="#0A0E1A" stroke-width="2"/>
<text x="118" y="232" text-anchor="middle" class="lbl" fill="#00D4FF">orchestrator</text>
<text x="118" y="248" text-anchor="middle" class="sub">directs · delegates</text>

<!-- ═══════════════════════════════════════════════════════════ -->
<!--  BOT 2 — RESEARCHER — x=440 — green — thinking            -->
<!-- ═══════════════════════════════════════════════════════════ -->
<!-- satellites -->
<g class="ol" style="transform-origin:440px 155px">
  <ellipse cx="440" cy="155" rx="10" ry="10" fill="#00FF9F" opacity="0.7"/>
</g>
<g class="or" style="transform-origin:440px 155px">
  <ellipse cx="440" cy="155" rx="8" ry="8" fill="#00FF9F" opacity="0.5"/>
</g>
<g class="b2" style="transform-origin:440px 155px">
  <g style="transform:scale(0.88);transform-origin:440px 155px">
    <ellipse cx="440" cy="155" rx="44" ry="46" fill="#00FF9F" filter="url(#gg)">
      <animate attributeName="rx" values="44;48;42;46;44" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="46;42;48;44;46" dur="1.1s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="425" cy="137" rx="13" ry="9" fill="rgba(255,255,255,0.18)" transform="rotate(-24 425 137)"/>
  </g>
</g>
<g class="bk2" style="transform-origin:440px 155px">
  <g class="sc">
    <rect x="426" y="148" width="9" height="16" rx="4" fill="#0A0E1A"/>
    <rect x="445" y="150" width="9" height="16" rx="4" fill="#0A0E1A"/>
  </g>
</g>
<text x="440" y="232" text-anchor="middle" class="lbl" fill="#00FF9F">researcher</text>
<text x="440" y="248" text-anchor="middle" class="sub">queries · enriches</text>

<!-- ═══════════════════════════════════════════════════════════ -->
<!--  BOT 3 — BUILDER — x=710 — amber — working                -->
<!-- ═══════════════════════════════════════════════════════════ -->
<g class="b3" style="transform-origin:710px 155px">
  <ellipse cx="710" cy="155" rx="56" ry="52" fill="#FF6B00" filter="url(#ga)">
    <animate attributeName="rx" values="56;52;60;54;56" dur="0.42s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="52;56;48;54;52" dur="0.42s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="693" cy="136" rx="18" ry="11" fill="rgba(255,255,255,0.22)" transform="rotate(-24 693 136)"/>
</g>
<g class="bk3" style="transform-origin:710px 155px">
  <rect x="694" y="148" width="13" height="13" rx="4" fill="#0A0E1A"/>
  <rect x="718" y="146" width="13" height="17" rx="4" fill="#0A0E1A"/>
</g>
<text x="710" y="232" text-anchor="middle" class="lbl" fill="#FF6B00">builder</text>
<text x="710" y="248" text-anchor="middle" class="sub">executes · ships</text>

<!-- ═══════════════════════════════════════════════════════════ -->
<!--  BOT 4 — MEMORY — x=980 — violet — done                   -->
<!-- ═══════════════════════════════════════════════════════════ -->
<g class="b4" style="transform-origin:980px 155px">
  <ellipse cx="980" cy="155" rx="50" ry="54" fill="#7C3AED" filter="url(#gv)">
    <animate attributeName="rx" values="50;54;48;52;50" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="54;50;56;52;54" dur="2.2s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="963" cy="136" rx="15" ry="10" fill="rgba(255,255,255,0.20)" transform="rotate(-24 963 136)"/>
</g>
<g class="bk4" style="transform-origin:980px 155px">
  <rect x="963" y="145" width="10" height="19" rx="5" fill="#0A0E1A" transform="rotate(-15 968 155)"/>
  <rect x="985" y="145" width="10" height="19" rx="5" fill="#0A0E1A" transform="rotate(-15 990 155)"/>
</g>
<text x="980" y="232" text-anchor="middle" class="lbl" fill="#7C3AED">memory</text>
<text x="980" y="248" text-anchor="middle" class="sub">persists · recalls</text>

<!-- ═══════════════════════════════════════════════════════════ -->
<!--  BOT 5 — GUARDIAN — TOP CENTER (1062,70) — red — blocked  -->
<!-- ═══════════════════════════════════════════════════════════ -->
<!-- alert ring -->
<circle cx="1100" cy="80" r="44" fill="none" stroke="#FF4444" stroke-width="1" opacity="0.2">
  <animate attributeName="r" values="44;52;44" dur="1.5s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.2;0.05;0.2" dur="1.5s" repeatCount="indefinite"/>
</circle>
<g class="b5" style="transform-origin:1100px 80px">
  <rect x="1064" y="44" width="72" height="72" rx="18" fill="#FF4444" filter="url(#gr)"/>
  <ellipse cx="1082" cy="60" rx="12" ry="8" fill="rgba(255,255,255,0.18)" transform="rotate(-24 1082 60)"/>
</g>
<g class="bk5" style="transform-origin:1100px 80px">
  <rect x="1085" y="68" width="9" height="14" rx="3" fill="#0A0E1A" transform="rotate(16 1090 75)"/>
  <rect x="1105" y="68" width="9" height="14" rx="3" fill="#0A0E1A" transform="rotate(16 1110 75)"/>
</g>
<text x="1100" y="142" text-anchor="middle" class="lbl" fill="#FF4444">guardian</text>
<text x="1100" y="156" text-anchor="middle" class="sub">monitors · alerts</text>

<!-- ── bottom bar ── -->
<line x1="40" y1="272" x2="1140" y2="272" stroke="#1E3A5F" stroke-width="0.5" opacity="0.6"/>
<text x="590" y="292" text-anchor="middle" font-family="Courier New,monospace" font-size="10px" fill="#1E3A5F" letter-spacing="2px">abheos  ·  5 agents  ·  DEPLOYED  ·  git-backed  ·  zero cloud deps</text>
</svg>
