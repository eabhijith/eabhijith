name: Generate GitHub Stats Cards

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Generate stats, langs and trophy cards
        env:
          GH_USERNAME: eabhijith
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_DIR: dist
        run: node generate-stats.mjs

      - name: Generate agents card
        env:
          GH_USERNAME: eabhijith
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_PATH: dist/github-agents.svg
        run: node generate-github-card.mjs

      - name: Streak card
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          if curl -sfL --max-time 30 \
            "https://streak-stats.demolab.com/?user=eabhijith&background=0A0E1A&ring=00D4FF&fire=FF6B00&currStreakLabel=00D4FF&sideLabels=00FF9F&dates=CBD5E1&border=1E3A5F" \
            -o "$tmp" && [ -s "$tmp" ] && ! grep -qiE "maximum retries|went wrong|unavailable" "$tmp"; then
            mv "$tmp" dist/streak.svg
            echo "Streak updated: $(wc -c < dist/streak.svg) bytes"
          else
            echo "::warning::Streak endpoint unavailable — keeping previous dist/streak.svg"
            rm -f "$tmp"
          fi

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update stats cards"
          file_pattern: "dist/stats.svg dist/langs.svg dist/streak.svg dist/trophy.svg dist/activity.svg dist/github-agents.svg"
