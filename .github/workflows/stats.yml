name: Generate GitHub Stats Cards

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        run: |
          curl -s "https://github-readme-stats.vercel.app/api?username=eabhijith&show_icons=true&bg_color=0A0E1A&title_color=00D4FF&text_color=CBD5E1&icon_color=00FF9F&border_color=1E3A5F&count_private=true&include_all_commits=true&hide_border=false" \
            -o dist/stats.svg || \
          curl -s "https://github-readme-stats-git-main-anuraghazra.vercel.app/api?username=eabhijith&show_icons=true&bg_color=0A0E1A&title_color=00D4FF&text_color=CBD5E1&icon_color=00FF9F&border_color=1E3A5F&count_private=true" \
            -o dist/stats.svg
          echo "Stats: $(wc -c < dist/stats.svg) bytes"

      - name: Top langs card
        run: |
          curl -s "https://github-readme-stats.vercel.app/api/top-langs/?username=eabhijith&layout=compact&bg_color=0A0E1A&title_color=00D4FF&text_color=CBD5E1&border_color=1E3A5F&langs_count=8" \
            -o dist/langs.svg
          echo "Langs: $(wc -c < dist/langs.svg) bytes"

      - name: Streak card
        run: |
          curl -s "https://streak-stats.demolab.com/?user=eabhijith&background=0A0E1A&ring=00D4FF&fire=FF6B00&currStreakLabel=00D4FF&sideLabels=00FF9F&dates=CBD5E1&border=1E3A5F" \
            -o dist/streak.svg
          echo "Streak: $(wc -c < dist/streak.svg) bytes"

      - name: Trophy card
        run: |
          curl -s "https://github-profile-trophy.vercel.app/?username=eabhijith&theme=onestar&no-bg=true&no-frame=true&column=4&margin-w=4" \
            -o dist/trophy.svg
          echo "Trophy: $(wc -c < dist/trophy.svg) bytes"

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update stats cards"
          file_pattern: "dist/stats.svg dist/langs.svg dist/streak.svg dist/trophy.svg"
